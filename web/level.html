<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Level Tile Viewer · DiabloHFConverter</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #14110d; color: #ddd3c0; font: 13px/1.45 Consolas, "Cascadia Mono", monospace; }
  header { padding: 12px 16px; border-bottom: 1px solid #3a3124; background: #1b1711; }
  h1 { margin: 0 0 4px; font-size: 17px; color: #e8c67a; }
  .sub { color: #968a74; font-size: 12px; }
  main { padding: 12px 16px 40px; }
  .panel { border: 1px solid #3a3124; background: #1b1711; padding: 10px; margin-bottom: 12px; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: end; }
  label { display: flex; flex-direction: column; gap: 3px; color: #a99b80; font-size: 11px; }
  input { background: #0f0d0a; border: 1px solid #4a3e2c; color: #eee2c8; padding: 4px 6px; font: inherit; }
  input.wide { width: 420px; }
  input.mid { width: 180px; }
  input.num { width: 70px; }
  button { background: #3b2f1d; border: 1px solid #6b5327; color: #f0d9a0; padding: 5px 14px; font: inherit; cursor: pointer; }
  button:hover { background: #4c3c25; }
  button:disabled { opacity: .45; cursor: default; }
  #status { color: #8bbf7a; min-height: 18px; }
  .err { color: #e08a8a; }
  .cols { display: grid; grid-template-columns: 360px 1fr; gap: 12px; }
  .tile-canvas { background: repeating-conic-gradient(#222 0 25%, #191919 0 50%) 0 0 / 16px 16px; image-rendering: pixelated; }
  .assembly-wrap { overflow: auto; max-height: 520px; padding: 6px; border: 1px solid #3a3124; background: #0b0907; }
  .frames { display: flex; flex-wrap: wrap; gap: 8px; }
  .frame-card, .micro-card { border: 1px solid #3a3124; background: #110e0a; padding: 6px; }
  .frame-card { width: 150px; text-align: center; }
  .frame-card canvas, .micro-card canvas { display: block; margin: 0 auto 4px; background: repeating-conic-gradient(#222 0 25%, #191919 0 50%) 0 0 / 16px 16px; image-rendering: pixelated; }
  .label { color: #e8c67a; font-size: 12px; }
  .muted { color: #8f836e; font-size: 11px; }
  table { border-collapse: collapse; width: 100%; font-size: 11px; margin-top: 6px; }
  th, td { border: 1px solid #32291d; padding: 2px 4px; text-align: left; }
  th { color: #d8b96f; background: #241d13; }
  td.hl { color: #ffcf6a; }
  #micros { display: grid; grid-template-columns: repeat(2, minmax(260px, 1fr)); gap: 10px; }
  #meta { color: #c9b58b; }
</style>
</head>
<body>
<header>
  <h1>Level Tile Viewer</h1>
  <div class="sub">inspect TIL → MIN → level CEL：megatile / micro pieces / TileType / frame / 组装预览。用于核对 FillTile(60,70,71) 这类地图对象。</div>
</header>
<main>
  <section class="panel">
    <div class="row">
      <label>WS URL <input id="wsUrl" class="mid" value="ws://localhost:18765" /></label>
      <button id="connectBtn">连接</button>
      <label>MPQ 路径 <input id="archive" class="wide" placeholder="D:/work/xt/diablo/DevilutionX-Hell Fire/DIABDAT.MPQ（或 hellfire.mpq）" /></label>
      <button id="inspectBtn" disabled>检查</button>
    </div>
    <div class="row" style="margin-top:8px">
      <label>CEL <input id="cel" class="mid" value="levels/towndata/town.cel" /></label>
      <label>TIL <input id="til" class="mid" value="levels/towndata/town.til" /></label>
      <label>MIN <input id="min" class="mid" value="levels/towndata/town.min" /></label>
      <label>SOL <input id="sol" class="mid" value="levels/towndata/town.sol" /></label>
      <label>PAL <input id="palette" class="mid" value="levels/towndata/town.pal" /></label>
      <label>blocks <input id="blocks" class="num" type="number" value="16" /></label>
      <label>micro_len <input id="microLen" class="num" type="number" value="16" /></label>
      <label>megatile <input id="megatile" class="num" type="number" value="71" /></label>
    </div>
    <div id="status" style="margin-top:8px"></div>
  </section>

  <div class="cols">
    <section class="panel">
      <div class="label">组装预览（isometric，乘 4×）</div>
      <div class="assembly-wrap"><canvas id="assembly" class="tile-canvas"></canvas></div>
      <div id="meta" class="muted" style="margin-top:6px"></div>
    </section>
    <section class="panel">
      <div class="label">CEL frames（点击可切换 1× / 4×）</div>
      <div id="frames" class="frames"></div>
    </section>
  </div>

  <section class="panel">
    <div class="label">Micro pieces</div>
    <div id="micros"></div>
  </section>
</main>
<script type="module" src="src/level.js?v=20261109c"></script>
</body>
</html>
